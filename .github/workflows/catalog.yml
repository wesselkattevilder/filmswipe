name: Filmlijst bijwerken

on:
  schedule:
    - cron: "17 4 1 * *"   # elke 1e van de maand, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Films ophalen bij TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/update_catalog.py
      - name: Opslaan
        run: |
          git config user.name "filmswipe-bot"
          git config user.email "filmswipe-bot@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet || git commit -m "Filmlijst bijgewerkt $(date +%Y-%m-%d)"
          git push
